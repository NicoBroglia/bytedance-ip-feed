name: Refresh IP classification feed

on:
  schedule:
    - cron: '17 4 * * *' # daily, 04:17 UTC (off the hour to avoid the cron rush)
  workflow_dispatch:
    inputs:
      allow_shrink:
        description: 'Accept a >30% drop in any provider (only after checking it is genuine)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails (and leaves the committed feed untouched) if any source is down or returns garbage.
      - name: Build feed
        env:
          FEED_CONTACT: ${{ github.server_url }}/${{ github.repository }}
          ALLOW_SHRINK: ${{ inputs.allow_shrink && '1' || '0' }}
        run: node build-feed.js

      # build-feed.js only rewrites files when the sha256 of the prefix lists changed,
      # so an empty diff here means the prefixes are identical to the last commit.
      - name: Commit if prefixes changed
        id: commit
        run: |
          FILES="bytedance-feed.json bytedance-feed.lastgood.json feed.all.txt feed.all.lastgood.txt"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No prefix changes; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SUMMARY=$(node -p "const f = require('./bytedance-feed.json'); f.prefix_count + ' ByteDance + ' + f.networks.prefix_count + ' network prefixes (sha256 ' + f.content_hash.slice(0, 12) + ')'")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "feed: ${SUMMARY}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          [ -f bytedance-feed.json ] || exit 0
          node -e '
            const f = require("./bytedance-feed.json");
            const n = f.networks;
            const lines = [
              "### IP classification feed", "",
              "- generated_at: " + f.generated_at,
              "- ByteDance prefixes: " + f.prefix_count + " (" + f.prefixes.filter((p) => p.announced).length + " announced in BGP)",
              "- network prefixes: " + n.prefix_count,
              "- sha256: " + f.content_hash,
              "- changed this run: " + (process.env.CHANGED || "no (build failed or unchanged)"),
              "", "| provider | category | prefixes |", "|---|---|---|",
              ...Object.entries(n.providers).map(([p, i]) => "| " + p + " | " + i.category + " | " + i.count + " |"),
            ];
            console.log(lines.join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
